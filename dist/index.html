<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labo Puces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>/* Direction : outil technique et éditorial. Papier froid, encre bleu nuit, un accent pétrole,
   un cuivre réservé à « ce qui vient de changer ». Mise en page : colonne de lecture + panneau d'instrument. */
:root {
  --fond: #f3f5f4; --surface: #ffffff; --creux: #e9edeb; --encre: #15202b; --sourd: #55626e; --trait: #cfd6d3;
  --accent: #0d5c73; --accent-fond: #e1eef1; --cuivre: #a8501a; --cuivre-fond: #fbe9dc;
  --ok: #1d6b41; --info: #34558f; --exp: #5f4590; --est: #7d5a00; --hyp: #8f4310; --nv: #5d6570; --alerte: #a3261f;
  --f-titre: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-texte: "IBM Plex Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #10161b; --surface: #182129; --creux: #202b34; --encre: #e6ecef; --sourd: #9aa8b3; --trait: #33424e;
    --accent: #6cc0d6; --accent-fond: #17333c; --cuivre: #f0a06a; --cuivre-fond: #43281a;
    --ok: #6fcf97; --info: #8fb0ea; --exp: #b9a2e6; --est: #e2bd5a; --hyp: #f0a472; --nv: #a3adb8; --alerte: #ff8f86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #10161b; --surface: #182129; --creux: #202b34; --encre: #e6ecef; --sourd: #9aa8b3; --trait: #33424e;
  --accent: #6cc0d6; --accent-fond: #17333c; --cuivre: #f0a06a; --cuivre-fond: #43281a;
  --ok: #6fcf97; --info: #8fb0ea; --exp: #b9a2e6; --est: #e2bd5a; --hyp: #f0a472; --nv: #a3adb8; --alerte: #ff8f86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.55 var(--f-texte); }
h1, h2, h3, h4 { font-family: var(--f-titre); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.3rem; margin-top: 1.6rem; } h3 { font-size: 1.02rem; margin-top: 1.1rem; } h4 { font-size: .95rem; margin-top: .8rem; }
p { margin: .5rem 0; max-width: 68ch; } ul, ol { padding-left: 1.2rem; margin: .4rem 0; } li { margin: .25rem 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--cuivre); outline-offset: 2px; border-radius: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-size: .88rem; font-variant-numeric: tabular-nums; }
.aide, .src-meta { color: var(--sourd); font-size: .88rem; }
.alerte { color: var(--alerte); }
.evitement { position: absolute; left: -999px; } .evitement:focus { left: 8px; top: 8px; background: var(--surface); padding: 8px; z-index: 20; }

.bandeau { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--trait); }
.bandeau-in { max-width: 1240px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 12px; align-items: center; }
.marque-site { font: 600 1.1rem var(--f-titre); color: var(--encre); text-decoration: none; white-space: nowrap; letter-spacing: .02em; }
.nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: thin; }
.nav-lien { padding: 8px 10px; text-decoration: none; color: var(--sourd); white-space: nowrap; border-bottom: 3px solid transparent; font-weight: 500; }
.nav-lien:hover { color: var(--encre); } .nav-lien[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 8px; }
main:focus { outline: none; }
.vue-tete { margin-bottom: 8px; } .chapo { font-size: 1.05rem; color: var(--sourd); } .surtitre { font: 600 .8rem var(--f-titre); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
.pied { max-width: 1240px; margin: 0 auto; padding: 16px; border-top: 1px solid var(--trait); color: var(--sourd); font-size: .88rem; }
.legende { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; } .legende dd { margin: 0; }

/* Boutons et commandes */
button, select, input, textarea { font: inherit; color: inherit; }
.btn { background: var(--accent); color: var(--surface); border: 1px solid var(--accent); padding: 7px 14px; border-radius: 4px; cursor: pointer; font-weight: 500; }
.btn.sec { background: var(--surface); color: var(--accent); } .btn.petit { padding: 4px 9px; font-size: .85rem; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
select, input[type="search"] { background: var(--surface); border: 1px solid var(--trait); border-radius: 4px; padding: 6px 8px; max-width: 100%; }
.lien { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: left; }
.commandes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; } .commandes.col { flex-direction: column; align-items: stretch; gap: 4px; max-width: 420px; }
.etiquettes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.etiquette { display: inline-block; font-size: .78rem; border: 1px solid var(--trait); border-radius: 3px; padding: 1px 6px; color: var(--sourd); background: var(--surface); }
.puce-btn, .puce-lien { border: 1px solid var(--trait); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: .88rem; color: var(--encre); margin: 0 4px 4px 0; }
.puce-btn.actif { background: var(--accent); color: var(--surface); border-color: var(--accent); } .puce-lien { color: var(--accent); }
.onglets { display: flex; gap: 0; border-bottom: 1px solid var(--trait); margin: 10px 0; flex-wrap: wrap; }
.onglet { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--sourd); font-weight: 500; }
.onglet[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* Statuts et preuves */
.statut { display: inline-block; font: 500 .72rem var(--f-texte); padding: 1px 7px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; vertical-align: 1px; }
.statut-confirme { color: var(--ok); } .statut-declaration { color: var(--info); } .statut-experimental { color: var(--exp); }
.statut-estimation { color: var(--est); } .statut-hypothese { color: var(--hyp); border-style: dashed; } .statut-nonverifie { color: var(--nv); border-style: dotted; }
.faits { list-style: none; padding: 0; } .fait { padding: 7px 0; border-top: 1px solid var(--trait); } .faits .fait:first-child { border-top: 0; }
.preuve { display: inline-block; vertical-align: top; max-width: 100%; } .preuve[open] { display: block; margin-top: 4px; }
.preuve summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: center; } .preuve summary::-webkit-details-marker { display: none; }
.preuve-n { font-size: .78rem; color: var(--sourd); text-decoration: underline dotted; }
.preuve-corps, .preuve.bloc > ul { background: var(--creux); border-left: 3px solid var(--trait); padding: 6px 10px; margin-top: 4px; border-radius: 0 4px 4px 0; }
.preuve.bloc { display: block; margin: 8px 0; } .preuve.bloc summary { color: var(--accent); text-decoration: underline; font-size: .9rem; }
.srcs { list-style: none; padding: 0; margin: 4px 0; font-size: .88rem; } .srcs a { overflow-wrap: anywhere; }
.pubs-bloc { border-top: 2px solid var(--encre); margin-top: 20px; padding-top: 4px; } .pubs-bloc ul { list-style: none; padding: 0; } .pubs-bloc li { padding: 6px 0; border-top: 1px solid var(--trait); } .pub-these { font-size: .9rem; }
.lecture { background: var(--accent-fond); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 4px 4px 0; max-width: none; }
.note { border-left: 3px solid var(--cuivre); padding-left: 10px; color: var(--sourd); }
.erreurs { background: var(--cuivre-fond); border: 1px solid var(--alerte); border-radius: 4px; padding: 8px 12px; margin: 8px 0; }
.encadre { background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; padding: 4px 16px 12px; margin-top: 18px; }
.table-scroll { overflow-x: auto; } table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--trait); vertical-align: top; }
thead th { font: 600 .78rem var(--f-titre); text-transform: uppercase; letter-spacing: .05em; color: var(--sourd); }

/* Explorateur */
.chaine { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 14px; }
.fleche { color: var(--sourd); }
.maillon { display: inline-flex; gap: 7px; align-items: center; background: var(--surface); border: 1px solid var(--trait); border-radius: 4px; padding: 7px 11px; cursor: pointer; font-weight: 500; }
.maillon-n { font: 500 .75rem var(--f-mono); color: var(--sourd); } .maillon.actif { background: var(--encre); color: var(--fond); border-color: var(--encre); } .maillon.actif .maillon-n { color: var(--fond); }
.brique { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.brique-viz { background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; padding: 14px 16px; position: sticky; top: 64px; }
.brique-viz h2 { margin-top: 0; } .echelle { color: var(--sourd); font-size: .85rem; margin-top: 2px; } .court { font-size: 1.05rem; }
.approfondir { border: 1px solid var(--trait); border-radius: 4px; padding: 6px 12px; background: var(--surface); } .approfondir summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.limites li { color: var(--sourd); }
.schema { width: 100%; max-width: 480px; height: auto; display: block; margin: 0 auto; }
.schema .lbl { font: 500 12px var(--f-texte); fill: var(--encre); } .schema .lbl-s { font: 400 10.5px var(--f-texte); fill: var(--sourd); } .schema .val { font: 600 15px var(--f-mono); fill: var(--cuivre); }
.schema line, .schema polyline { stroke-width: 3; fill: none; } .fil-off { stroke: var(--trait); } .fil-1 { stroke: var(--cuivre); } .fil-0 { stroke: var(--accent); }
.mos, .porte, .bloc { fill: var(--creux); stroke: var(--sourd); stroke-width: 1.5; } .mos.passant, .porte-1, .bloc-actif { fill: var(--cuivre-fond); stroke: var(--cuivre); stroke-width: 2.5; } .noeud { fill: var(--encre); }
.bitbtn, .bit { font-family: var(--f-mono); border: 1px solid var(--trait); background: var(--surface); border-radius: 4px; cursor: pointer; padding: 5px 9px; }
.bitbtn.on, .bit.on { background: var(--cuivre-fond); border-color: var(--cuivre); color: var(--cuivre); font-weight: 600; }
.bits { display: flex; gap: 3px; } .bit { width: 30px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; } .bit.ro { cursor: default; background: var(--creux); } .bit.ro.on { background: var(--cuivre-fond); } .bit.petit { height: 20px; font-size: .75rem; }
.alu-grille { display: grid; grid-template-columns: max-content max-content 1fr; gap: 6px 10px; align-items: center; } .alu-grille .num { font: .82rem var(--f-mono); color: var(--sourd); } .alu-grille .lbl { font-weight: 500; font-size: .88rem; }
.deux { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; } .verite { width: auto; } .verite td, .verite th { text-align: center; font-family: var(--f-mono); padding: 3px 12px; } tr.courant td { background: var(--cuivre-fond); font-weight: 600; }
.etapes { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; padding: 0; counter-reset: e; } .etapes li { counter-increment: e; font-size: .82rem; padding: 3px 9px; border: 1px solid var(--trait); border-radius: 3px; color: var(--sourd); } .etapes li::before { content: counter(e) ". "; } .etapes li.courant { background: var(--cuivre-fond); border-color: var(--cuivre); color: var(--encre); font-weight: 600; } .etapes li.fait-ok { color: var(--encre); }
.cache tr.succes td { background: var(--accent-fond); } .cache tr.defaut td { background: var(--cuivre-fond); }
.soc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; border: 2px solid var(--sourd); border-radius: 6px; background: var(--creux); }
.soc-bloc { background: var(--surface); border: 1px solid var(--sourd); border-radius: 4px; padding: 14px 6px; cursor: pointer; font-size: .86rem; font-weight: 500; } .soc-bloc.large { grid-column: span 3; } .soc-bloc.actif { background: var(--cuivre-fond); border-color: var(--cuivre); border-width: 2px; }
.rendement { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .dies { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin: 6px 0; } .dies.grand { grid-template-columns: repeat(4, 1fr); }
.die { aspect-ratio: 1; border-radius: 2px; background: var(--accent); } .die.perdu { background: transparent; border: 1.5px dashed var(--cuivre); }
.barre { position: relative; background: var(--creux); border: 1px solid var(--trait); height: 24px; border-radius: 3px; overflow: hidden; } .barre-plein { background: var(--accent-fond); border-right: 3px solid var(--accent); height: 100%; } .barre-val { position: absolute; left: 8px; top: 1px; font: 600 .85rem var(--f-mono); }
.distinctions { border-top: 2px solid var(--encre); margin-top: 28px; } .couches th[scope="row"] { font-family: var(--f-titre); white-space: nowrap; }
.notion-def { background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; padding: 4px 14px 12px; margin-top: 6px; }

/* Simulateur */
.exemples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.exemple { text-align: left; background: var(--surface); border: 1px solid var(--trait); border-radius: 4px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; } .exemple span { color: var(--sourd); font-size: .85rem; } .exemple.actif { border-color: var(--accent); border-left-width: 4px; }
.sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; } .sim h2:first-child { margin-top: 8px; }
.editeur { width: 100%; font: .88rem/1.5 var(--f-mono); background: var(--surface); border: 1px solid var(--trait); border-radius: 4px; padding: 10px; resize: vertical; tab-size: 4; white-space: pre; overflow: auto; }
.sim-etat { font-size: .9rem; min-height: 1.5em; }
.listing { max-height: 330px; overflow: auto; border: 1px solid var(--trait); border-radius: 4px; background: var(--surface); } .listing-table th { position: sticky; top: 0; background: var(--surface); }
.listing tr.courant td { background: var(--cuivre-fond); box-shadow: inset 3px 0 0 var(--cuivre); font-weight: 600; } .listing tr.vient td { background: var(--creux); } .listing tr.courant.vient td { background: var(--cuivre-fond); }
.etiq { color: var(--accent); } .pseudo { color: var(--sourd); } .src-l { color: var(--sourd); }
.explication { background: var(--accent-fond); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 4px 4px 0; min-height: 110px; } .explication h3 { margin-top: 0; } .instr-courante { font-weight: 600; }
.pc-ligne { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; } .val-pc { padding: 2px 8px; border: 1px solid var(--trait); border-radius: 3px; background: var(--surface); }
.regs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
.reg { display: flex; justify-content: space-between; gap: 6px; padding: 3px 6px; border: 1px solid var(--trait); border-radius: 3px; background: var(--surface); min-width: 0; } .reg-nom { font: 500 .8rem var(--f-mono); white-space: nowrap; } .abi { color: var(--sourd); margin-left: 4px; font-weight: 400; } .reg-val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .8rem; }
.modifie, .mem tr.modifie td { background: var(--cuivre-fond) !important; border-color: var(--cuivre) !important; } .reg.modifie .reg-val, .val-pc.modifie { color: var(--cuivre); font-weight: 600; } .mem tr.lu td { background: var(--accent-fond); }
html:not([data-sans-anim]) .reg.modifie, html:not([data-sans-anim]) .mem tr.modifie td { animation: flash .5s ease-out; } @keyframes flash { from { outline: 3px solid var(--cuivre); } to { outline: 0 solid transparent; } }
.journal { font-size: .85rem; padding-left: 0; list-style: none; } .journal li { border-top: 1px solid var(--trait); padding: 3px 0; }
.doc { border-top: 2px solid var(--encre); margin-top: 24px; } .doc-grille { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; } .instrs dt { font-weight: 500; font-size: .85rem; margin-top: 6px; } .instrs dd { margin: 0; color: var(--cuivre); }

/* Carte */
.filtres { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; padding: 10px 12px; } .filtre { display: flex; flex-direction: column; font-size: .8rem; color: var(--sourd); gap: 2px; } .filtre-n { font: 500 .85rem var(--f-mono); color: var(--sourd); padding-bottom: 6px; }
.carte { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 10px; }
.couche { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--trait); } .couche:first-child { border-top: 2px solid var(--encre); } .couche-tete h3 { margin-top: 0; } .couche-tete p { font-size: .78rem; margin: 2px 0; }
.couche-acteurs { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.acteur { text-align: left; background: var(--surface); border: 1px solid var(--sourd); border-radius: 4px; padding: 6px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; max-width: 220px; }
.acteur-nom { font: 600 .95rem var(--f-titre); } .acteur-role, .acteur-type, .acteur-multi { font-size: .74rem; color: var(--sourd); } .acteur-multi { color: var(--accent); }
.acteur.type-standard { border-style: dashed; border-radius: 14px; } .acteur.type-organisme { border-style: double; border-width: 3px; }
.acteur.sel { background: var(--encre); border-color: var(--encre); } .acteur.sel span { color: var(--fond); } .acteur.estompe { opacity: .4; } .acteur.lie { border-color: var(--cuivre); border-width: 2px; }
.marques { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; } .marque { font: 500 .7rem var(--f-texte); padding: 0 5px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap; }
.marque-client { color: var(--info); } .marque-fournisseur { color: var(--ok); } .marque-concurrent { color: var(--alerte); } .marque-partenaire { color: var(--exp); } .marque-capital { color: var(--est); }
.fiche { background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; padding: 12px 16px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; } .fiche h2 { margin-top: 0; } .fiche-tete { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.roles, .rels, .produits, .pubs-liste { list-style: none; padding: 0; } .stade { font-size: .74rem; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 0 5px; }
.rel { width: 100%; text-align: left; background: var(--fond); border: 1px solid var(--trait); border-radius: 4px; padding: 6px 8px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; } .rel.ouvert { border-color: var(--accent); } .rel-niv { margin-left: auto; font-size: .74rem; color: var(--sourd); }
.rel-detail { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 4px 0 8px; } .rel-meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font-size: .88rem; } .rel-meta dd { margin: 0; } .rel-meta dt { color: var(--sourd); }

/* Comparateur */
.choix { border: 1px solid var(--trait); border-radius: 6px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 12px; background: var(--surface); } .case { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; } .case.bloque { color: var(--sourd); }
.cmp { border-top: 2px solid var(--encre); } .cmp-ligne { display: grid; grid-template-columns: 170px repeat(var(--cols), minmax(0, 1fr)); gap: 0 16px; border-bottom: 1px solid var(--trait); padding: 6px 0; }
.cmp-dim { margin: 6px 0 0; font-size: .95rem; } .cmp-col-tete { display: flex; flex-direction: column; font-family: var(--f-titre); font-size: 1.05rem; } .cmp-col-tete .lien { font: .8rem var(--f-texte); } .cmp-qui { display: none; } .cmp-case .fait { font-size: .93rem; }
.cmp-entete { position: sticky; top: 52px; background: var(--fond); z-index: 2; }
.biz { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }

/* Dossier */

            ),
            h("span", { class: "aide", "aria-live": "polite" }, `${events.length} événement${events.length > 1 ? "s" : ""}`)
          ),
          h("ol", { class: "frise" }, events.map((e) => h(
            "li",
            { class: "frise-item statut-bord-" + e.s },
            h("time", { datetime: e.date }, fmtDate(e.date)),
            h(
              "div",
              { class: "frise-corps" },
              h("h3", {}, e.titre),
              fait({ t: e.texte, s: e.s, src: e.src }, "div"),
              h("p", { class: "frise-liens" }, e.liens.map((l) => l.acteur ? lien(acteur(l.acteur).nom, "carte", { sel: l.acteur }, "puce-lien") : lien("Publication", "bibliotheque", { pub: l.pub }, "puce-lien")))
            )
          ))),
          events.length ? null : h("p", { class: "aide" }, "Aucun événement de ce statut.")
        ),
        h(
          "section",
          { id: "d-chaine", tabindex: "-1" },
          h("h2", {}, "La chaîne de valeur, avant et après"),
          h("p", {}, "Qui occupe chaque étage, du jeu d'instructions au centre de données. Les cases d'Arm sont marquées ; ce qui apparaît avec l'AGI CPU est signalé comme nouveau."),
          onglets([{ id: "avant", nom: "Avant mars 2026" }, { id: "apres", nom: "Depuis mars 2026" }], st.moment, (id) => {
            st.moment = id;
            draw();
            const t = root.querySelector('#d-chaine [aria-selected="true"]');
            if (t) t.focus();
          }, "Moment"),
          h("div", { class: "table-scroll" }, h(
            "table",
            { class: "chaine-valeur", id: "chaine-table" },
            h("thead", {}, h("tr", {}, h("th", {}, "Étage"), h("th", {}, "Qui l'occupe"))),
            h("tbody", {}, ch.etages.map((e) => h(
              "tr",
              {},
              h("th", { scope: "row" }, e.nom, e.notion ? h("span", { class: "bloc-lien" }, lien("notion : " + e.notion, "explorateur", { notion: e.notion, brique: NOTIONS.find((n) => n.id === e.notion).brique })) : null),
              h("td", {}, etatChaine[e.id].map((o) => h("span", { class: "occupant " + (o.arm ? "arm " : "") + (o.nouveau ? "nouveau" : "") }, o.qui, o.nouveau ? h("span", { class: "tag-nouveau" }, "nouveau") : null)))
            )))
          )),
          h(
            "div",
            { class: "deux-col" },
            h("div", {}, h("h3", {}, "Ce qui est établi"), faits(ch.etabli)),
            h("div", {}, h("h3", {}, "Ce qui reste une hypothèse ou n'est pas vérifié"), faits(ch.hypotheses))
          )
        ),
        h(
          "section",
          { id: "d-tensions", tabindex: "-1" },
          h("h2", {}, "Des relations commerciales qui deviennent aussi concurrentielles"),
          h("div", { class: "tensions" }, DOSSIER_ARM.tensions.map((t) => h(
            "article",
            { class: "tension" },
            h("h3", {}, t.titre),
            fait({ t: t.texte, s: t.s, src: t.src }, "div"),
            h("p", { class: "frise-liens" }, lien("Fiche " + acteur(t.a).nom, "carte", { sel: t.a }, "puce-lien"), lien("Fiche " + acteur(t.b).nom, "carte", { sel: t.b }, "puce-lien"))
          )))
        ),
        h(
          "section",
          { id: "d-implications", tabindex: "-1" },
          h("h2", {}, "Implications possibles"),
          h("div", { class: "trois-col" }, DOSSIER_ARM.implications.map((i) => h("div", {}, h("h3", {}, i.pour), faits(i.points))))
        ),
        h(
          "section",
          { id: "d-debat", tabindex: "-1" },
          h("h2", {}, "Deux lectures qui s'opposent"),
          h("div", { class: "deux-col" }, DOSSIER_ARM.contradictoire.map((c3) => h("div", { class: "these" }, h("h3", {}, c3.these), faits(c3.arguments))))
        ),
        h("section", { id: "d-incertain", tabindex: "-1" }, h("h2", {}, "Ce qui reste incertain"), faits(DOSSIER_ARM.incertitudes)),
        h(
          "section",
          { id: "d-preuves", tabindex: "-1" },
          h("h2", {}, "Publications et notions à l'appui"),
          h("ul", { class: "pubs-liste" }, DOSSIER_ARM.pubs.map((id) => {
            const p = pub(id);
            return h("li", {}, lien(p.titre, "bibliotheque", { pub: p.id }), h("span", { class: "src-meta" }, ` ${p.auteurs}, ${fmtDate(p.date)}. ${TYPES_PUB[p.type]}. ${ACCES[p.acces]}.`));
          })),
          h("p", {}, "Notions utiles : ", DOSSIER_ARM.notions.map((n) => lien(n, "explorateur", { notion: n, brique: NOTIONS.find((x) => x.id === n).brique }, "puce-lien")))
        )
      );
      if (focus) {
        const el = document.getElementById(focus);
        if (el) el.focus();
      }
    };
    draw();
  }

  // src/views/library.js
  var MODULES = { explorateur: "Explorateur", simulateur: "Simulateur", carte: "Carte", comparateur: "Comparateur", "dossier-arm": "Dossier Arm" };
  function vueBibliotheque(root) {
    const st = etat.bibliotheque;
    st.f = st.f || { type: "", acces: "", notion: "", q: "" };
    const cibleModule = (m) => m.startsWith("brique:") ? ["explorateur", { brique: m.slice(7) }, "Explorateur"] : [m, null, MODULES[m]];
    const liste = h("div", { id: "bib-liste" });
    const compteur = h("span", { class: "filtre-n", id: "bib-n", "aria-live": "polite" });
    const drawListe = () => {
      const q = st.f.q.trim().toLowerCase();
      const res = PUBLICATIONS.filter((p) => (!st.f.type || p.type === st.f.type) && (!st.f.acces || p.acces === st.f.acces) && (!st.f.notion || p.notions.includes(st.f.notion)) && (!q || [p.titre, p.auteurs, p.these, p.question].join(" ").toLowerCase().includes(q)));
      compteur.textContent = `${res.length} publication${res.length > 1 ? "s" : ""} sur ${PUBLICATIONS.length}`;
      remplir(liste, res.length ? h("ul", { class: "pubs" }, res.map((p) => {
        const ouvert = st.pub === p.id;
        return h(
          "li",
          { class: "pub " + (ouvert ? "ouverte" : ""), id: "pub-" + p.id },
          h(
            "div",
            { class: "pub-tete" },
            h("h2", {}, h("button", { type: "button", class: "pub-titre", "aria-expanded": String(ouvert), onclick: () => {
              st.pub = ouvert ? null : p.id;
              drawListe();
              const b = document.querySelector(`#pub-${p.id} .pub-titre`);
              if (b) b.focus();
            } }, p.titre)),
            h("p", { class: "pub-meta" }, `${p.auteurs}. ${p.lieu}, ${fmtDate(p.date)}.`),
            h("p", { class: "etiquettes" }, h("span", { class: "etiquette" }, TYPES_PUB[p.type]), h("span", { class: "etiquette acces-" + p.acces }, ACCES[p.acces]))
          ),
          h("p", { class: "pub-these" }, h("strong", {}, "Thèse ou résultat. "), p.these),
          ouvert ? h(
            "div",
            { class: "pub-corps" },
            h(
              "dl",
              {},
              h("dt", {}, "Question étudiée"),
              h("dd", {}, p.question),
              h("dt", {}, "Méthode"),
              h("dd", {}, p.methode),
              h("dt", {}, "Limites"),
              h("dd", {}, p.limites),
              h("dt", {}, "Commanditaire connu"),
              h("dd", {}, p.commanditaire),
              h("dt", {}, "Accès"),
              h("dd", {}, `${ACCES[p.acces]}, le ${fmtDate(DATE_VERIF)}.`),
              h("dt", {}, "Lien"),
              h("dd", {}, h("ul", { class: "srcs" }, sourceItem(p.source))),
              h("dt", {}, "Notions"),
              h("dd", {}, p.notions.map((n) => lien(n, "explorateur", { notion: n, brique: NOTIONS.find((x) => x.id === n).brique }, "puce-lien"))),
              h("dt", {}, "Acteurs"),
              h("dd", {}, p.acteurs.map((a) => lien(acteur(a).nom, "carte", { sel: a }, "puce-lien"))),
              h("dt", {}, "Utilisée dans"),
              h("dd", {}, p.modules.map((m) => {
                const [v, patch, nom] = cibleModule(m);
                return lien(nom, v, patch, "puce-lien");
              }))
            )
          ) : null
        );
      })) : h("p", { class: "aide" }, "Aucune publication ne correspond. Élargissez les filtres."));
    };
    const sel = (id, label, opts, key) => h(
      "span",
      { class: "filtre" },
      h("label", { for: id }, label),
      h("select", { id, onchange: (e) => {
        st.f[key] = e.target.value;
        drawListe();
      } }, h("option", { value: "" }, "Tous"), Object.entries(opts).map(([k, v]) => h("option", { value: k, selected: st.f[key] === k }, v)))
    );
    remplir(
      root,
      h(
        "header",
        { class: "vue-tete" },
        h("h1", {}, "Bibliothèque"),
        h("p", { class: "chapo" }, "Articles scientifiques, documents techniques, rapports d'entreprise et analyses cités dans le laboratoire. Pour chacun : ce qui a réellement été lu, la méthode, les limites et le commanditaire.")
      ),
      h(
        "div",
        { class: "filtres", role: "search", "aria-label": "Filtres de la bibliothèque" },
        sel("bib-type", "Type", TYPES_PUB, "type"),
        sel("bib-acces", "Accès", ACCES, "acces"),
        sel("bib-notion", "Notion", Object.fromEntries(NOTIONS.map((n) => [n.id, n.id])), "notion"),
        h("span", { class: "filtre" }, h("label", { for: "bib-q" }, "Recherche"), h("input", { type: "search", id: "bib-q", value: st.f.q, placeholder: "titre, auteur, thèse", oninput: (e) => {
          st.f.q = e.target.value;
          drawListe();
        } })),
        compteur
      ),
      liste,
      h("p", { class: "aide" }, "Statut « inaccessible » : aucune publication retenue n'est dans ce cas. Les documents que l'audit n'a pas pu ouvrir ne figurent pas ici ; ils apparaissent comme sources « non rouvertes » dans les fiches.")
    );
    drawListe();
    if (st.pub) {
      const el = document.getElementById("pub-" + st.pub);
      if (el) el.scrollIntoView({ block: "start" });
    }
  }

  // src/main.js
  var VUES = [
    { id: "explorateur", nom: "Explorateur", titre: "De l'instruction à la puce", rendu: vueExplorateur },
    { id: "simulateur", nom: "Simulateur", titre: "Simulateur de processeur", rendu: vueSimulateur },
    { id: "carte", nom: "Carte", titre: "Carte de l'industrie", rendu: vueCarte },
    { id: "comparateur", nom: "Comparateur", titre: "Comparateur", rendu: vueComparateur },
    { id: "dossier-arm", nom: "Dossier Arm", titre: "Dossier Arm", rendu: vueDossier },
    { id: "bibliotheque", nom: "Bibliothèque", titre: "Bibliothèque", rendu: vueBibliotheque }
  ];
  var main = document.getElementById("contenu");
  var nav = document.getElementById("nav");
  var nettoyage = null;
  function lire(cle) {
    try {
      return localStorage.getItem(cle);
    } catch {
      return null;
    }
  }
  function ecrire(cle, v) {
    try {
      localStorage.setItem(cle, v);
    } catch {
    }
  }
  function route() {
    const id = (location.hash || "").replace("#", "");
    const vue = VUES.find((v) => v.id === id) || VUES[0];
    if (typeof nettoyage === "function") nettoyage();
    nav.replaceChildren(...VUES.map((v) => h("a", { href: "#" + v.id, class: "nav-lien", "aria-current": v.id === vue.id ? "page" : null }, v.nom)));
    main.replaceChildren();
    try {
      nettoyage = vue.rendu(main) || null;
    } catch (e) {
      nettoyage = null;
      main.replaceChildren(h("div", { class: "erreurs", role: "alert" }, h("strong", {}, "Cet espace n'a pas pu s'afficher."), h("p", {}, String(e && e.message ? e.message : e))));
      console.error(e);
    }
    document.title = "Labo Puces";
    window.scrollTo(0, 0);
    const actif = nav.querySelector('[aria-current="page"]');
    if (actif && actif.scrollIntoView) actif.scrollIntoView({ block: "nearest", inline: "center" });
  }
  var bAnim = document.getElementById("reglage-anim");
  function majAnim() {
    const coupe = document.documentElement.hasAttribute("data-sans-anim");
    bAnim.setAttribute("aria-pressed", String(!coupe));
    bAnim.textContent = coupe ? "Animations : coupées" : "Animations : actives";
  }
  if (lire("labo-anim") === "non" || lire("labo-anim") === null && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.setAttribute("data-sans-anim", "");
  bAnim.addEventListener("click", () => {
    const coupe = document.documentElement.toggleAttribute("data-sans-anim");
    if (!coupe) document.documentElement.setAttribute("data-anim-forcee", "");
    else document.documentElement.removeAttribute("data-anim-forcee");
    ecrire("labo-anim", coupe ? "non" : "oui");
    majAnim();
    route();
  });
  majAnim();
  document.getElementById("legende").append(legendeStatuts());
  document.getElementById("date-verif").textContent = fmtDate(DATE_VERIF);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
